  <defs
     id="defs1">
    <marker
       style="overflow:visible"
       id="Triangle"
       refX="0"
       refY="0"
       orient="auto-start-reverse"
       inkscape:stockid="Triangle arrow"
       markerWidth="0.5"
       markerHeight="0.5"
       viewBox="0 0 1 1"
       inkscape:isstock="true"
       inkscape:collect="always"
       preserveAspectRatio="xMidYMid">
      <path
         transform="scale(0.5)"
         style="fill:context-stroke;fill-rule:evenodd;stroke:context-stroke;stroke-width:1pt"
         d="M 5.77,0 -2.88,5 V -5 Z"
         id="path135" />
    </marker>
    <style
       id="style1">
      .outline { fill: none; stroke: #000; stroke-width: 1; }
      .thin { fill: none; stroke: #000; stroke-width: 0.5; }
      .label { font-family: sans-serif; font-size: 5px; }
      .hidden { fill: none; stroke: #000; stroke-width: 0.55; stroke-dasharray: 3 2; }
      .guide { fill: none; stroke: #000; stroke-width: 0.4; stroke-dasharray: 1.5 1.5; }
    </style>
  </defs>
  <!-- Cardboard shelf: the top reference edge of the instrument -->
  <rect
     x="-171.14244"
     y="13.931869"
     width="117.8814"
     height="8.0779305"
     class="outline"
     id="rect1"
     transform="rotate(-90)" />
  <!-- Cardboard body: straight machine-cut top edge, square bottom, lower-right 45-degree clearance cut -->
  <path
     d="M 23.175002,53 H 163.17502 v 39 l -79.000018,79 h -61 z"
     class="outline"
     id="path1" />
  <!-- Straw sight mounted on the rear face, directly beneath and parallel to the shelf -->
  <rect
     x="57.617443"
     y="-31.396313"
     width="120"
     height="7"
     rx="3.5"
     ry="3.5"
     class="hidden"
     id="rect2"
     transform="rotate(90)" />
  <!-- Printed quadrant mounted below the body top, leaving a structural margin above it -->
  <line
     x1="38.175003"
     y1="61"
     x2="148.17496"
     y2="61"
     class="thin"
     id="line2" />
  <line
     x1="38.175003"
     y1="61"
     x2="38.175003"
     y2="171"
     class="thin"
     id="line3" />
  <path
     d="M 148.17502,61 A 110,110 0 0 1 38.175002,171"
     class="thin"
     id="path3" />
  <!-- Eyelet at the quadrant vertex, clear of the shelf-body joint -->
  <circle
     cx="38.175003"
     cy="61"
     r="2.5"
     class="outline"
     id="circle3" />
  <!-- Plumb line and bob hang below the bottom of the body -->
  <line
     x1="38.175003"
     y1="61"
     x2="38.175003"
     y2="211"
     class="outline"
     id="line4" />
  <circle
     cx="38.175003"
     cy="219"
     r="5"
     class="outline"
     id="circle4" />
  <!-- Alignment indication: quadrant top edge parallel to machine-cut body top -->
  <line
     x1="26.175003"
     y1="53"
     x2="160.17496"
     y2="53"
     class="guide"
     id="line5" />
  <!-- Minimal labels -->
  <text
