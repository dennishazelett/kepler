     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:document-units="mm"
     inkscape:zoom="0.76288194"
     inkscape:cx="339.50207"
     inkscape:cy="453.54331"
     inkscape:window-width="1208"
     inkscape:window-height="905"
     inkscape:window-x="294"
     inkscape:window-y="119"
     inkscape:window-maximized="0"
     inkscape:current-layer="svg13" />
  <defs
     id="defs1">
    <marker
       style="overflow:visible"
       id="Triangle"
       refX="0"
       refY="0"
       orient="auto-start-reverse"
       inkscape:stockid="Triangle arrow"
       markerWidth="0.5"
       markerHeight="0.5"
       viewBox="0 0 1 1"
       inkscape:isstock="true"
       inkscape:collect="always"
       preserveAspectRatio="xMidYMid">
      <path
         transform="scale(0.5)"
         style="fill:context-stroke;fill-rule:evenodd;stroke:context-stroke;stroke-width:1pt"
         d="M 5.77,0 -2.88,5 V -5 Z"
         id="path135" />
    </marker>
    <style
       id="style1">
      .outline { fill: none; stroke: #000; stroke-width: 1; }
      .thin { fill: none; stroke: #000; stroke-width: 0.5; }
      .label { font-family: sans-serif; font-size: 5px; }
      .hidden { fill: none; stroke: #000; stroke-width: 0.55; stroke-dasharray: 3 2; }
      .guide { fill: none; stroke: #000; stroke-width: 0.4; stroke-dasharray: 1.5 1.5; }
    </style>
  </defs>
  <!-- Cardboard shelf: the top reference edge of the instrument -->
  <rect
     x="20"
     y="45"
     width="140"
     height="8"
     class="outline"
     id="rect1" />
  <!-- Cardboard body: straight machine-cut top edge, square bottom, lower-right 45-degree clearance cut -->
  <path
     d="M20 53 H160 V92 L81 171 H20 Z"
     class="outline"
     id="path1" />
  <!-- Straw sight mounted on the rear face, directly beneath and parallel to the shelf -->
  <rect
     x="32.023491"
     y="53.751678"
     width="120"
     height="7"
     rx="3.5"
     ry="3.5"
     class="hidden"
     id="rect2" />
  <!-- Printed quadrant mounted below the body top, leaving a structural margin above it -->
  <line
     x1="35"
     y1="61"
     x2="145"
     y2="61"
     class="thin"
     id="line2" />
  <line
     x1="35"
     y1="61"
     x2="35"
     y2="171"
     class="thin"
     id="line3" />
  <path
     d="M145 61 A110 110 0 0 1 35 171"
     class="thin"
     id="path3" />
  <!-- Eyelet at the quadrant vertex, clear of the shelf-body joint -->
  <circle
     cx="35"
     cy="61"
     r="2.5"
     class="outline"
     id="circle3" />
  <!-- Plumb line and bob hang below the bottom of the body -->
  <line
     x1="35"
     y1="61"
     x2="35"
     y2="211"
     class="outline"
     id="line4" />
  <circle
     cx="35"
     cy="219"
     r="5"
     class="outline"
     id="circle4" />
  <!-- Alignment indication: quadrant top edge parallel to machine-cut body top -->
  <line
     x1="23"
     y1="53"
     x2="157"
     y2="53"
     class="guide"
     id="line5" />
  <!-- Minimal labels -->
  <text
     x="90"
     y="39"
     text-anchor="middle"
     class="label"
     id="text5">Cardboard shelf / top reference edge</text>
  <text
     x="65.29866"
     y="58.983223"
     class="label"
     id="text6">Straw sight behind body</text>
  <text
     x="96"
     y="86"
     class="label"
     id="text7">Cardboard body</text>
  <text
     x="83"
     y="123"
     class="label"
     id="text8">Printed quadrant</text>
  <text
     x="3.6829269"
     y="73.634148"
     class="label"
     id="text9">Eyelet at vertex</text>
  <text
     x="90.097565"
     y="50.780487"
     class="label"
     id="text10">Alignment margin</text>
  <text
     x="113"
     y="144"
     class="label"
     id="text11">45° clearance cut</text>
  <text
     x="41"
     y="205"
     class="label"
     id="text12">Plumb line</text>
  <text
     x="41"
     y="222"
     class="label"
     id="text13">Plumb bob</text>
  <path
     style="fill:none;stroke:#000000;stroke-width:2;stroke-dasharray:none;stroke-opacity:1;marker-end:url(#Triangle)"
     d="m 13.170732,65.121951 c 5.487805,-6.219512 11.707316,-4.756099 11.707316,-4.756099"
     id="path13" />
</svg>
