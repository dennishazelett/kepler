       id="tspan2"
       x="15.528444"
       y="40.346577">vertex</tspan></text>
  <text
     x="116.17499"
     y="144"
     class="label"
     id="text11">45° clearance cut</text>
  <text
     x="44.175003"
     y="205"
     class="label"
     id="text12">Plumb line</text>
  <text
